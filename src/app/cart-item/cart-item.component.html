
    <img [src]="getImageUrl(product())" [alt]="product().name" />
    <div class="details">
        <div>
            <h2>{{ product().name }}</h2>
            <p>{{product().description}}</p>
            <p>Part Type: {{product().category}}</p>
           
        </div>
    </div>
    <div class="price">
        <p [ngClass]="getPriceClass()">{{product().price | currency}}</p>
        @if(product().discount > 0){
        <p> {{ product().price * (1 - product().discount) | currency}} (sale)</p>
        }
        
    
        <button class="cta" (click)="removeFromCart()">Remove</button>
        
    </div>
